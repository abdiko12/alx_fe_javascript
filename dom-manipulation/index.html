<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Quote Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 600px;
    }
    #quoteDisplay {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      min-height: 60px;
    }
    #syncNotification {
      background: #ffd;
      padding: 10px;
      margin-top: 20px;
      border: 1px solid #dda;
      display: none;
    }
    #syncNotification button {
      margin-left: 15px;
    }
    input[type="text"] {
      padding: 8px;
      margin-right: 8px;
      margin-top: 10px;
      width: calc(50% - 12px);
      box-sizing: border-box;
    }
    button {
      padding: 8px 15px;
      margin-top: 10px;
      cursor: pointer;
    }
    select {
      padding: 8px;
      margin-top: 10px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <div id="quoteDisplay"></div>

  <button id="newQuote">Show New Quote</button>

  <div id="addQuoteForm"></div>

  <div>
    <input type="text" id="newQuoteText" placeholder="Enter a new quote" />
    <input type="text" id="newQuoteCategory" placeholder="Enter quote category" />
    <button onclick="addQuote()">Add Quote</button>
  </div>

  <div style="margin-top: 20px;">
    <button onclick="exportToJsonFile()">Export Quotes to JSON</button>
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
  </div>

  <!-- Sync notification -->
  <div id="syncNotification">
    <span id="syncMessage"></span>
    <button id="syncNowBtn">Sync Now</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
